<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="织网">

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>织网</title>
<style>
:root{--green:#1e3a2f;--green2:#2c5944;--gold:#c2a24b;--gold2:#d9bc6a;--cream:#f0ebdf;--card:#fffdf6;--ink:#2a332e;--muted:#8b918c;--line:#e6dfcd}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0ebdf;color:#2a332e;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:98px}
.serif{font-family:"Songti SC","STSong","SimSun",Georgia,serif}
.titlebar{background:#1e3a2f;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(217,188,106,.25)}
.titlebar .t{font-size:17px;font-weight:600;letter-spacing:2px}
.titlebar .rev{background:linear-gradient(135deg,#c2a24b,#d9bc6a);border:none;color:#1e3a2f;font-weight:600;border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
main{padding:14px 14px 20px}
.hero{background:linear-gradient(155deg,#123527,#24503f);color:#fff;border-radius:0 0 22px 22px;padding:20px 20px 22px;margin:-14px -14px 14px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(18,53,39,.25)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,75,.30),transparent 70%)}

.hero .hrow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hero .hbrand{display:flex;align-items:center;gap:11px}
.hero .avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#e6cf8a,#b8923f);border:2px solid rgba(255,255,255,.35);color:#123527;font-family:"Songti SC","STSong",serif;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);flex-shrink:0}
.hero .bname{font-size:17px;font-weight:600}
.hero .ben{font-size:10px;letter-spacing:1.5px;opacity:.75;margin-top:2px}
.hero .hbadge{font-size:11px;background:rgba(255,255,255,.08);border:1px solid rgba(217,188,106,.6);color:#e6cf8a;border-radius:999px;padding:6px 12px;cursor:pointer}
.hero .gsen{font-size:10px;color:#d9bc6a;letter-spacing:3px;margin-top:18px;position:relative;z-index:1}
.hero h2{font-size:26px;font-weight:600;margin:6px 0 6px;position:relative;z-index:1}
.hero .sub{font-size:12px;color:#d7e3da;line-height:1.6;position:relative;z-index:1}
.hero .progrow{display:flex;justify-content:space-between;font-size:12px;opacity:.95;margin-top:16px;position:relative;z-index:1}
.hero .prog{background:#e8dfc8;border-radius:999px;height:10px;overflow:hidden;margin-top:8px;position:relative;z-index:1;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.hero .prog i{display:block;height:100%;background:linear-gradient(90deg,#c2a24b,#e6cf8a);border-radius:999px;transition:width .3s;box-shadow:0 0 8px rgba(217,188,106,.55)}
.hero .hstats{margin-top:14px;display:flex;align-items:baseline;gap:0;position:relative;z-index:1}
.hero .hstats b{font-size:20px;color:#e6cf8a;font-weight:600;font-family:Georgia,"Songti SC",serif;margin-right:6px}
.hero .hstats span{font-size:11px;opacity:.9;margin-right:16px}
.hero .hstats .sep{width:1px;height:14px;background:rgba(255,255,255,.28);align-self:center;font-size:0;margin-right:16px}
.mstats{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.14);padding-top:13px;position:relative;z-index:1}
.mstat{flex:1;text-align:center}
.mstat+.mstat{border-left:1px solid rgba(255,255,255,.22)}
.mstat b{display:block;font-family:Georgia,"Times New Roman","Songti SC",serif;font-size:18px;color:#e6cf8a;font-weight:600;line-height:1.25}
.mstat span{font-size:10px;color:rgba(255,255,255,.72);letter-spacing:1px}
.hero .hfoot{display:flex;align-items:center;gap:10px;margin-top:18px;position:relative;z-index:1}
.hero .cta{flex:1;background:linear-gradient(135deg,#c2a24b,#d9bc6a);color:#1e3a2f;border:none;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.hero .hfoot .mini{font-size:11px;opacity:.8}
.hero .outline{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.65);color:#fff;border-radius:999px;padding:8px 16px;font-size:12px;cursor:pointer}
.card{background:#fffdf6;border:1px solid #e3dac0;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(60,50,20,.06)}
.chh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.chh .dot{width:8px;height:8px;background:#c2a24b;transform:rotate(45deg);border-radius:1px;flex-shrink:0}
.chh .tt{font-size:15px;font-weight:600;color:#1e3a2f}
.chh .en{margin-left:auto;font-size:9px;letter-spacing:2px;color:#8a6d22;font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:#fffdf6;border:1px solid #e3dac0;border-radius:14px;padding:12px 14px;box-shadow:0 3px 10px rgba(60,50,20,.06);margin-bottom:12px}
.search .sico{display:flex;align-items:center}
.search input{flex:1;border:none;background:none;font-size:14px;outline:none;color:#2a332e}
.hint{font-size:11px;color:#6f766f;margin-top:8px;letter-spacing:.3px}
.fgroup{border-bottom:1px solid #ece4cf;padding:10px 0}
.fgroup:last-child{border-bottom:none;padding-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .lb{font-size:12px;color:#5f665f;width:100%;margin-bottom:2px;font-weight:600}
.chip{font-size:12px;padding:6px 13px;border-radius:999px;background:#faf6ea;border:1px solid #e0d7bf;color:#4a514b;cursor:pointer}
.chip.on{background:#1e3a2f;border-color:#1e3a2f;color:#fff}
.sortrow{display:flex;align-items:center;gap:8px;padding-top:10px}
.sortrow span{font-size:12px;color:#8b918c}
.sortrow b{font-size:12px;color:#1e3a2f;font-weight:600}
.reshead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.reshead h3{font-size:16px;color:#1e3a2f;font-weight:600}
.reshead .gold{font-size:11px;color:#8a6d22;background:#f3ecd8;border:1px solid #e6dcc0;border-radius:999px;padding:3px 10px;font-weight:600;letter-spacing:.5px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px}
.dayhead h3{font-size:17px;color:#1e3a2f;font-weight:600}
.dayhead .ds{font-size:12px;color:#8b918c}
.dayhead .ds b{color:#8a6d22;font-weight:600}
.rescount{font-size:11px;color:#6f766f;margin-bottom:10px;padding:0 2px}
.rescount b{color:#8a6d22;font-weight:600}
.resbtns{display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:0 2px}
.resbtns .g{background:#1e3a2f;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 2px 6px rgba(30,58,47,.25)}
.resbtns .t{background:#fdf9ec;border:1px solid #c2a24b;color:#8a6d22;font-size:13px;font-weight:600;border-radius:999px;padding:10px 18px;cursor:pointer}
.bhead{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:#1e3a2f;margin-bottom:2px}
.bhead .dot{width:8px;height:8px;background:#c2a24b;transform:rotate(45deg);border-radius:1px}
.btag{font-size:12px;color:#6b726d;margin-bottom:8px;padding-left:16px}
.task{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid #efe9da;cursor:pointer;transition:background .15s}
.task:active{background:#faf6ea}
.task:last-child{border-bottom:none}
.task .ck{width:27px;height:27px;border-radius:50%;border:2px solid #c2a24b;background:rgba(201,162,75,.08);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:all .15s;box-shadow:inset 0 0 0 2px #fff;align-self:flex-start;margin-top:2px;margin-right:11px}
.task:active .ck{transform:scale(.92)}
.task.done .ck{background:#1e3a2f;border-color:#1e3a2f;box-shadow:none}
.task .tx{flex:1;font-size:13px;line-height:1.5}
.task.done .tx{color:#8b918c;text-decoration:line-through}
.task .badge{font-size:11px;background:#fdf9ec;border:1px solid #d9bc6a;color:#8a6d22;border-radius:999px;padding:3px 10px;flex-shrink:0;font-weight:600}
.mini{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid #f0ead9}
.mini:last-child{border-bottom:none}
.mini .d2{width:6px;height:6px;border-radius:50%;background:#c2a24b;flex-shrink:0}
.mini .mtag{font-size:10px;color:#1e3a2f;background:#e9f0e9;border:1px solid #d4e0d4;border-radius:999px;padding:2px 8px;flex-shrink:0;font-weight:600}
.mini .tx{flex:1;font-size:12px;color:#2a332e;line-height:1.5}
.prow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#8b918c;margin-top:10px}
.prow b{font-size:15px;color:#1e3a2f;font-family:Georgia,serif}
.pbar{background:#d9cfb4;border-radius:999px;height:7px;overflow:hidden;margin:6px 0 12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#c2a24b,#d9bc6a);border-radius:999px;transition:width .3s}
.fb{padding:10px 12px 10px 14px;border-left:2px solid #c2a24b;background:#faf6ea;border-radius:0 10px 10px 0;margin-bottom:8px}
.fb:last-child{margin-bottom:0}
.fbq{font-size:13px;color:#2a332e;line-height:1.6}
.fbt{font-size:10px;color:#4a514b;margin-top:4px}
.listrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #efe9da;cursor:pointer}
.listrow:last-child{border-bottom:none}
.listrow:active{background:#faf6ea}
.lr-t{flex:1;min-width:0;font-size:13px;color:#2a332e;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-s{font-size:10px;padding:3px 10px;border-radius:999px;flex-shrink:0;font-weight:600;letter-spacing:.5px}
.st-unread{color:#5f665f;background:#f4efe4;border:1px solid #e0d7bf}
.st-read{color:#fff;background:#1e3a2f}
.st-fb{color:#7a5f16;background:#ead9ab}
.mats{margin-top:6px;border-top:1px solid #ece4cf;padding-top:4px}
.mats .mt{display:flex;align-items:center;gap:8px;padding:10px 4px;cursor:pointer;border-radius:8px}
.mats .mt:active{background:#faf6ea}
.mats .mt .tt{flex:1;font-size:13px;color:#2a332e}
.mats .mt .st{font-size:10px;color:#c2a24b;letter-spacing:.5px}
.empty2{text-align:center;color:#8b918c;font-size:12px;line-height:1.8;padding:18px 8px}
.empty2 .eico{width:46px;height:46px;border-radius:50%;background:#f3ecd8;border:1px solid #e3dac0;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.empty2 .eact{margin-top:10px;background:#1e3a2f;color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:12px;cursor:pointer}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fdfaf1;border-top:1px solid #e3dac0;box-shadow:0 -4px 16px rgba(60,50,20,.08);display:flex;z-index:9;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:none;background:none;font-size:11px;letter-spacing:2px;color:#6f6a5e;cursor:pointer;padding:4px 0;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{display:block}
.tabbar button.on{color:#1e3a2f;font-weight:700}
.tabbar button.on svg{stroke:#c2a24b;stroke-width:2.4}
.mask{display:none;position:fixed;inset:0;background:rgba(20,35,28,.55);z-index:10}
.modal{display:none;position:fixed;left:0;right:0;bottom:0;background:#fffdf6;border-radius:18px 18px 0 0;padding:22px 20px 32px;z-index:11;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto}
.modal h3{font-size:18px;font-weight:600;margin-bottom:10px;padding-right:28px;color:#1e3a2f}
.modal .close{position:absolute;top:12px;right:14px;font-size:22px;color:#8b918c;background:none;border:none;cursor:pointer}
.modal .body{font-size:14px;line-height:1.9;color:#2a332e;white-space:pre-wrap;margin:8px 0 12px}
.modal .link{display:inline-block;color:#c2a24b;font-size:13px;text-decoration:underline;margin-bottom:12px}
.modal label{font-size:12px;color:#8b918c;display:block;margin-bottom:6px}
.modal textarea{width:100%;min-height:66px;border:1px solid #e6dfcd;border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:#f6f1e5}
.modal .save{margin-top:12px;width:100%;padding:12px;border:none;border-radius:12px;background:#1e3a2f;color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.modal .row{font-size:13px;color:#2a332e;line-height:2}
.modal .row b{color:#1e3a2f}
.foot{text-align:center;font-size:10px;color:#8b918c;padding:10px;letter-spacing:.5px}
.empty{text-align:center;color:#8b918c;font-size:13px;padding:18px 8px}

.go{color:#c2a24b;font-size:14px;font-weight:600;flex-shrink:0;margin-left:6px;padding-right:2px}
.dhb{font-size:11px;color:#8a6d22;background:#fffdf6;border:1px solid #d9bc6a;border-radius:999px;padding:3px 10px;font-weight:600}
.dhb-ok{background:#e9f0e9;border-color:#2c5944;color:#1e3a2f}
.tom{background:#faf6ea;border:1px dashed #e3dac0;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.hero .progrow b{font-family:Georgia,"Songti SC",serif;color:#e6cf8a;font-size:14px}
.task.back .ck{border-style:dashed;background:rgba(201,162,75,.05)}
.task.back .tx{color:#8b918c}
.task.back .badge{opacity:.85}
.msgbox{width:100%;min-height:84px;border:1px solid #e3dac0;border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fdf9ec;color:#2a332e;margin-bottom:10px}
.msg{padding:10px 4px;border-bottom:1px solid #efe9da}
.msg:last-child{border-bottom:none}
.msg .mt{font-size:10px;color:#8b918c;letter-spacing:.5px}
.msg .mx{font-size:13px;line-height:1.6;margin:4px 0 8px;color:#2a332e}
.msg .mb{display:flex;gap:10px}
.msg .mb button{background:#fdf9ec;border:1px solid #e0d7bf;color:#8a6d22;border-radius:999px;padding:3px 12px;font-size:10px;cursor:pointer}
.msg .mb button.del{background:none;border-color:#e6dfcd;color:#a89d84}
.card.focus{box-shadow:0 0 0 1.5px #c2a24b,0 6px 16px rgba(60,50,20,.08)}
.card .btn{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#1e3a2f,#2c5944);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.ghost{background:none;border:none;color:#a89d84;font-size:12px;cursor:pointer;text-decoration:underline}
.msgbox::placeholder{color:#b0a88f}
.msgbox:-ms-input-placeholder{color:#b0a88f}
</style></head>

<div class="titlebar">
  <div class="t" id="tbTitle">你好，Wade</div>
  <button class="rev" id="tbBtn" onclick="openReview()">今日反馈</button>
</div>
<main id="main"></main>
<div class="foot">数据存本机 · 无登录 · 无广告 · 织网 v8.3 每日计划版</div>
<div class="tabbar">
  <button id="tbHome" class="on" onclick="switchTab('home')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.0"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>首页</button>
  <button id="tbCheck" onclick="switchTab('check')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.0"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>打卡</button>
  <button id="tbTalk" onclick="switchTab('talk')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.0"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.2 0-2.4-.2-3.4-.7L3 21l1.8-5.7A8.5 8.5 0 1 1 21 11.5z"/></svg>AI管家</button>
  <button id="tbMine" onclick="switchTab('mine')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.0"><circle cx="12" cy="8" r="4"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>我的</button>
</div>
<div class="mask" id="mask" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">✕</button>
  <h3 id="mTitle"></h3>
  <div class="body" id="mBody"></div>
  <a class="link" id="mLink" href="#" target="_blank" rel="noopener">查看原文链接</a>
  <label>你的反馈（写给AI管家，帮助改进明天的计划）</label>
  <textarea id="mFb" placeholder="读完想到啥、哪里没看懂，写一句就行"></textarea>
  <button class="save" onclick="saveFb()">保存反馈</button>
</div>
<div class="modal" id="revModal">
  <button class="close" onclick="closeModal()">✕</button>
  <h3>今日小结</h3>
  <div id="revBody"></div>
  <button class="save" onclick="copyFeedback()">复制反馈发给AI管家</button>
</div>
<div class="modal" id="setModal">
  <button class="close" onclick="closeModal()">✕</button>
  <h3>关于织网</h3>
  <div class="row">
    <b>织网 · 每日学习教练</b><br>
    每天一份当日计划＋当天内容，做完打勾、写反馈。<br><br>
    数据存本机 · 不上传不联网<br>
    无登录 · 无广告 · 无收费<br>
    每日计划由管家更新，每晚生成第二天<br>
    想改计划？去「AI管家」页写留言发给管家即可<br><br>
    版本 v8.3 · 每日计划版
  </div>
  <button class="save" onclick="copyFeedback()">复制反馈发给AI管家</button>

var DEFAULT={"updatedAt":"2026-08-16 01:40","note":"每晚生成第二天计划，明早打开即见；晚上想改计划，随时告诉AI管家。","reply":{"date":"2026-08-16","text":"你好 Wade，我是你的 AI 管家。今天起：①《原则》剩余内容已按15天切片，每天在「看书」里直接读原文＋导读；②机器人产业链每天一课；③工作日（周一~周五）加机器人行业日报＋AI日报。读完把进度/想法发我，我考察你并更新明天。"},"plans":[{"date":"2026-08-16","blocks":[{"id":"read","name":"看书","emoji":"📚","tasks":[{"id":"read-20260816-1","text":"读书《原则》第1天：生活原则·拥抱现实，应对现实，约28页"}],"materials":[{"id":"read-20260816-m1","title":"《原则》第1天 · 生活原则·拥抱现实，应对现实（上）","body":"【今日导读】\n重点：做一个超级现实的人；从高层面俯视自己；痛苦+反思=进步。读完自问：最近一件痛苦的事，用\"痛苦+反思=进步\"复盘一遍，会得到什么？\n\n—— 今日原文（约15385字）——\n\n么教益，开始成为我的一项游戏。这项游戏我做得越\n\n===== ?116? =====\n多就越擅长，也就越不会对这些情况感到痛苦，同时思考、总结出原\n则、利用原则获得回报的过程也变得越来越有收获。我学会了喜爱自己\n的痛苦，我想这是一种健康的视角，就像学会喜爱锻炼身体一样（这一\n点我目前还做不到）。\n年轻时，我仰慕那些极为成功的人，觉得他们因为非凡而成功。当\n我认识这样的人后，我发现他们都像我、像所有人一样会犯错误，会为\n自己的弱点挣扎，我也不再觉得他们特别与众不同、特别伟大。他们并\n不比其他人更快乐，他们的挣扎与一般人一样多，甚至更多。就算在实\n现最不可思议的梦想之后，他们依然会体验到更多痛苦，而不是自豪。\n我显然也是这样。尽管我在几十年前就实现了自己曾经以为最难以企及\n的梦想，但直到今天我还在苦拼。我逐渐认识到，成功的满足感并不来\n自实现目标，而是来自努力奋斗。想要理解我的意思，可以想象你最大\n的目标，不管是什么：赚很多钱、赢得奥斯卡奖、经营一家了不起的机\n构，或者成为运动明星。再想象一下你的目标突然实现了：一开始你会\n感到快乐，但不会很久，你将很快发现，你需要为另一些东西而奋斗。\n看看那些很早就实现了梦想的人，如童星、中彩票者、很早就达到巅峰\n的职业运动员。假如他们没有对另一些更大的、更值得追求的东西产生\n热情的话，他们通常最终不会快乐。生活总有顺境和逆境，努力拼搏并\n不只会让你的顺境变得更好，还会让你的逆境变得不那么糟糕。我至今\n仍在苦拼，我将这么做下去直到离世，因为就算我想躲避，痛苦也会找\n上我。\n由于所有这些拼搏与学习，我已经做了自己想做的一切事，去了自\n己想去的一切地方，遇到了自己想遇到的一切人，得到了自己想拥有的\n一切，经历了一段迷人的职业生涯，而最有收获的是，建立了许多美妙\n的人际关系。我经历了生活中的一切，从一文不名到财富不菲，从籍籍\n无名到功成名就，所以我知道其中的差别。尽管我是自下而上而不是自\n上而下地（这是更好的，或许也影响了我的看法）经历这一切，但我的\n判断是，拥有很多东西、身处顶层的人，得到的边际收益并不像多数人\n认为的那么大。拥有最基本的东西，如一张舒适的床、良好的人际关\n系、美食、美好的性生活等，是最重要的，而这些东西并不会因你拥有\n金钱的多寡而发生明显变化。你在顶层遇到的人并不一定比在中下层遇\n到的更特殊。\n拥有更多东西所产生的边际收益会很快下降。事实上，得到适量的\n\n===== ?117? =====\n东西比得到太多的东西更好，因为后者会伴随着沉重的负担。身处顶层\n会给你更大的选择空间，但也对你提出了更多要求。综合判断下，成为\n名人也许不如默默无闻。尽管一个人可以给其他人带来很多有益影响，\n但相对来看，这种影响又可以小到忽略不计。由于上述种种原因，我不\n能说一种充满成就的紧张人生就一定比充满享受的轻松人生更好，但是\n我敢说，坚强比软弱好，而拼搏让人坚强。性格使然，我不会改变自己\n的生活，但我无法告诉你什么样的生活对你而言是最好的。你需要自己\n选择。我看到的情况是，发现自己的性格，过与性格相适应的生活，才\n是最幸福的。\n既然让我自己成功的愿望已经让位于帮助他人成功的愿望，这就成\n为我现在的拼搏目标。我现在能清楚地看到，我的目标、你的目标、所\n有其他事物的目标都会演变，都会以某种微小的方式为进化做贡献。最\n初我没有这种意识，只是追逐自己想要的东西。但一路走来，我不断进\n化，而现在我和你们分享这些原则，以便帮助你们进化。我认识到，传\n递知识就像传递基因，其意义超过了单个的人，因为人死了基因还会延\n续下去。因此，我把我所学到的关于如何正确拼搏的道理传递给你们，\n以便帮助你们成功，或者至少，帮助你们从每一次的努力中收获最大的\n成效。\n\n===== ?118? =====\n良好的原则是应对现实的有效方法。为了总结出自己的原则，\n我花了很多时间思考。我将分享原则背后的思考，而不是简单地告\n诉你我的原则。\n\n===== ?119? =====\n我\n\n认为一切事情的发生都是由于反复出现、不断演进的因果关系。在\n大爆炸发生时，宇宙所有的法则和力量都被创造、被推进，随着时间的\n推移相互发生作用，就像一系列复杂的、环环相扣的机器：星系的构\n造、地理和生态系统的构造、我们的经济和市场，以及每个人。我们每\n个人都是一部机器，它又由不同的机器组成，如我们的循环系统、神经\n系统等，这些机器创造了我们的思想、梦想、情感，以及每个人特性的\n所有其他方面。所有这些机器一起进化，创造了我们每天遇到的现实。\n●\n\n考察影响你的那些事物的规律，从而理解其背后的因果\n关系，并学习有效应对这些事物的原则。\n通过这样做，你将开始理解每个\n“\n再现的情境\n”\n背后的机理，并逐渐\n形成一个应对该情境的\n“\n意境地图\n”\n。随着你对这些关系的理解不断加\n深，你就能看到隐藏在扑面而来的复杂事物中的实质。你将明白你面对\n的事物属于哪种类型，并自然而然地运用正确的原则帮助自己渡过难\n关。接着，现实会向你发出强烈的信号，或者回报你或者惩罚你，以体\n现你的原则的运用效果，这样你就能学着相应地调整这些原则。\n我们能不能妥善应对我们遇到的现实，最重要的决定因素是有没有\n良好的应对原则。我的意思不是说所有人遇到的情况都相同。显然，不\n同地方的不同人面临着不同的挑战。尽管如此，我们遇到的大多数现实\n情况都可以归入某个类别，而这些类别的数目并不是特别多。如果你每\n次都能记下你遇到的是哪种情况（如一个孩子出生、失去一份工作、出\n现一次与他人的分歧），并将其列出来，其总数可能只有几百个，而其\n中只有一小部分对你而言是独特的。你试一下就能亲自判断我说的对不\n对，而且你也会开始列出你需要思考并确立原则的事情。\n我取得的任何成功都是由于我遵循的原则，而不是由于我本人的任\n何特征，所以遵循这些原则的任何人都有可能创造大体相同的结果。尽\n管如此，我不想让你盲从我的（或任何人的）原则。我建议你深入思考\n所有你从不同来源获得的原则，并总结出自己的一套原则，以便你在现\n实中遇到某种情境时，都能利用这些原则。\n“\n生活原则\n”\n和\n“\n工作原则\n”\n都将以纲目的形式列出，分为三个层次，\n所以你可以依据自己的时间和兴趣，或者一扫而过，或者深入阅读。\n\n===== ?120? =====\n1\n\n高层次原则，也是每一条的标题，以单个数字表示。\n1.1\n\n中层次原则包含在每一条中，由两个数字表示，前一个代表它\n所属的高层次原则，后一个代表它在该条中出现的次序。\na.\n\n分原则处在中层次原则之下，以字母表示。\n三个层次的原则的后面都有解释。为了方便你们快速浏览，我已经\n在\n“\n生活原则\n”\n的结尾和\n“\n工作原则\n”\n的开头加入了各项原则的概要。我建\n议你们先阅读高层次原则及其解释，以及中层次原则和分原则的标\n题。\n“\n生活原则\n”\n是希望读者完整阅读的，而\n“\n工作原则\n”\n更多地想要为读\n者提供一些参考。\n\n===== ?121? =====\n第二部分\n生活原则\n\n===== ?122? =====\n1\n拥抱现实，应对现实\n世\n\n界上最重要的事情是理解现实如何运行，以及如何应对现实。面对\n这一过程的心态至关重要。我发现很有帮助的做法是，把生活想象为一\n场游戏，我面临的每个问题都是一个需要破解的谜。我通过解谜获得一\n块宝石，即一项原则，它能帮助我在未来避免同样的问题。不断收集这\n样的宝石能够提高我的决策水平，这样我就能进入更高一级的游戏，游\n戏变得更难，涉及的利益也变得越来越大。\n我在游戏过程中会产生各种情绪，这些情绪可能帮助我也可能伤害\n我。如果我能调和我的情绪与逻辑，只有在二者相符时才行动，我就能\n做出更好的决策。\n了解现实如何运行，构想我想要创造的东西，将其实现，是让我非\n常兴奋的事情。努力争取伟大的目标很容易让我失败，因而我必须不断\n学习并想出新的主意才能继续前进。我发现，卷入快速学习的反馈循环\n之中是件令人兴奋的事情，就像冲浪者热爱冲浪一样，尽管这有时会使\n你跌倒。不要理解错了，我至今依然害怕跌倒，依然觉得跌倒很痛苦。\n但我会思考这种痛苦，并明白我将克服这些挫折，而且我学到的东西将\n主要来自对挫折的反思。\n[1]\n就像长跑者忍耐痛苦去体验\n“\n跑步者的愉悦\n感\n”\n一样，我已经基本上走出了为犯错而痛苦的阶段，而是享受从犯错\n中学习的愉悦。我相信通过练习你也能改变自己的习惯，体验同样\n的\n“\n从犯错中学习的愉悦感\n”\n。\n1.1\n\n做一个超级现实的人\n理解现实，接受现实，处理现实问题，既是务实的，也是美妙的。\n我已经是一个超级现实的人，所以我学会了欣赏所有现实的美好，包括\n严酷的现实，并开始鄙视不现实的理想主义。\n不要理解错了：我相信实现梦想的重要性。在我看来，生命中最美\n\n===== ?123? =====\n好的事情就是实现梦想。追求梦想让生活有了韵味。我要强调的是，创\n造伟大事物的人不是空想者，而是彻底地扎根于现实。做一个超级现实\n的人将帮助你明智地选择自己的梦想并实现它。我发现下面这句话几乎\n永远是对的：\na.\n梦想\n+\n现实\n+\n决心\n=\n成功的生活。取得成功、推动进步的人对现实\n背后的因果关系有着深刻的理解，并利用原则实现自己的愿望。反过来\n也成立：没有深深扎根于现实的理想主义者会制造问题，而不是推动进\n步。\n成功的生活是什么样的？我们都有内心深处的需求，所以每个人都\n要决定对自己而言什么是成功。你想成为宇宙的主宰还是成天吃零食看\n电视，还是想要追求别的东西，我并不关心。我真的不关心。一些人想\n要改变世界，而另一些人只想与世无争地简单生活、享受生活。二者没\n有好坏之分。每个人都需要判断自己最珍视的是什么，并选择实现它的\n路径。\n下图以极为简单化的方式展示了你需要思考的抉择。花点时间思考\n一下，你处在下面这张图的哪个位置。你觉得自己处在什么位置？\n问题不只是对这两方面你分别追求多少，而是你如何努力工作以尽\n量实现二者兼得。这两方面我都很想要，所以我愉悦地努力工作，以争\n取二者兼得，并且发现它们很可能是一回事，而且相辅相成。我逐渐明\n白，从生活中获取尽可能多的东西，并不只是一个要为此而工作得更辛\n苦的问题。这更多的是一个有效工作的问题，因为有效工作能把我的能\n力提升几百倍。我并不关心你想要什么，或者你愿意为此付出多少辛\n劳。这是你应该决定的事。我只是试图向你传授，是什么帮助我最好地\n利用每一小时，并从每次努力中获取最大收获。\n最重要的是，我认识到以下颠扑不破的真理。\n\n===== ?124? =====\n1.2\n\n真相（或者更精确地说，对现实的准确理解）是任何\n良好结果的根本依据\n当真相与愿望不符时，大多数人抗拒真相。这很糟糕，因为好东西\n会自己照顾自己，而理解和应对不好的东西才是更重要的。\n你同意吗？如果不同意，以下内容就将对你无益。如果你同意，我\n们就继续阐述。\n1.3\n\n做到头脑极度开放、极度透明\n任何人都不是生来就知道真相是什么。我们必须或者自己发现真\n相，或者相信、追随其他人。关键在于知道哪种做法将带来更好的结\n果。\n[2]\n我相信：\na.\n对于快速学习和有效改变而言，头脑极度开放、极度透明是价值\n无限的。学习过程是一连串的实时反馈循环：我们做决定，看到结果，\n然后根据结果改进对现实的理解。做到头脑极度开放能够增强这些反馈\n循环的效率，因为这能让你和其他人无比清晰地看到你在做什么、为什\n么这么做，而不会产生误解。你的头脑越开放，你就越不会自欺，其他\n人也就越会给你诚实的反馈。如果他们是\n“\n可信\n”\n的人（知道什么样的人\n是\n“\n可信\n”\n[3]\n的也很重要），你就会从他们那里受益良多。\n做到极度透明、头脑极度开放，可以加快这一学习进程。这也可能\n很难，因为极度透明而不是有所遮掩，可能会招致批评。惧怕这一点是\n很自然的。但如果你不能坦然地让自己做到极度透明，你就学不到东\n西。\nb.\n不要担心其他人的看法，使之成为你的障碍。你必须以自己认为\n最好的独特的方式行事，这样做肯定会有反馈，你必须开明地思考这些\n反馈。\n学着做到极度透明，就像学习如何公开发言一样：一开始你会难\n堪，但你练得越多，你就越能应付自如。我就是这样。例如，我现在依\n然本能地觉得，我像在本书中这样极度透明是不舒服的，因为我在公开\n\n===== ?125? =====\n展示我的个人情况，这会引人注意，也会招致批评。但我还是这么做\n了，因为我知道这样做是最好的，而如果我让恐惧阻碍自己，我将对自\n己不满意。换言之，我在很长时间里都体会到极度透明的好处，所以现\n在如果不这么做，我反而会不舒服。\n除了让我能自由做自己之外，这样做还会让我和其他人相互理解，\n与彼此不理解相比，这更有效而且更让人快乐。想想看，如果人们不是\n隐藏看法，而是公开分享看法，这将减少多少误解，世界的运转将会变\n得多么高效，我们将会多么接近真相。我指的不是每个人的内心私密，\n而是人们对彼此和现实的看法。你们已经看到，我已经亲身体验到，这\n种极度探寻真相、极度透明，如何大大改善了我的决策和人际关系。所\n以每当我面对抉择时，我的直觉都是保持透明。我以此作为行事原则，\n并且建议你们也这么做。\nc.\n拥抱极度求真和极度透明将带来更有意义的工作和更有意义的人\n际关系。我在观察了成千上万个尝试了这种做法的人之后总结出的经验\n是，只要多练习，绝大多数人会感觉这样做很有收获，很快乐，换其他\n做法反而不舒服。\n这需要练习和改变人的习惯。我发现大多数习惯的改变通常需要约\n18\n个月，这也一样。\n1.4\n\n观察自然，学习现实规律\n大自然向我们展示了所有的现实规律。这些规律不是人创造的，但\n通过理解规律，我们能利用规律促进自身的进化，实现我们的目标。例\n如，人类能飞行，能在全世界发送手机信号，这些能力来自理解和应用\n已有的现实规律\n——\n物理规律或自然世界的法则。\n我花费大部分时间考察给我带来最直接影响的现实\n——\n经济、市\n场、与我打交道的人背后的驱动因素，同时，我也花时间考察自然，通\n过观察、阅读思考自然的运作原理，并与这方面最好的一些专家交谈，\n这带给我不少收获。我发现，考察人类和自然之间有哪些共同和不同的\n规律，既有趣也很有价值。这给我看待生活的态度带来了很大影响。\n首先，我发现大脑的进化让我们能够思考现实的运行方式，这是件\n很美妙的事。人类最独特的能力是，只有人类能从更高的维度看待现\n\n===== ?126? =====\n实，并总结出对现实的理解。其他物种都是遵循本能生活，只有人类能\n够超越自身，在当时所处的环境和时间（包括他生前和出生后的时间）\n中看待自身。例如，我们可以思考，大自然的\n“\n飞行机器\n”“\n游泳机器\n”\n以\n及无数其他从极微小的到极庞大的\n“\n机器\n”\n，是如何相互作用，组成一个\n有序运转、逐渐进化的整体的。这是因为人类的大脑进化出了复杂得多\n的大脑皮层，从而拥有抽象思考、逻辑思考的能力。\n由于拥有高层次的思考能力，人类在各物种中独一无二，但也只有\n人会出现混淆的情况。其他物种的生活简单直接得多，不会像人一样苦\n苦思索什么是好什么是坏。与动物不同，大多数人努力调和自身的情\n感、本能（来自人类大脑与动物相似的部分）与理性（来自人类大脑更\n发达的部分）。这一冲突导致人混淆了事实和自己想要的事实。我们来\n看看这一两难处境，以尝试理解现实的规律。\n人在尝试理解任何东西（经济、市场、天气等）时，都可以从两种\n视角出发：\n1.\n自上而下：努力找到这些东西背后的唯一驱动法则或规律。\n例如，在理解市场时，人可以研究影响所有经济和市场的普适法\n则，如供求关系；在理解物种时，人可以集中了解基因密码是如何\n对所有物种发生作用的。\n2.\n自下而上：研究每种具体情况及其背后的法则或规律，例\n如，小麦市场独特的法则或规律，或者使鸭子区别于其他物种的基\n因序列。\n自上而下地观察事物，是在宏观普适法则背景之下理解我们自身和\n现实规律的最佳途径。这不是说自下而上的角度没有价值。事实上，想\n要准确理解世界，这两种角度你都需要。采用自下而上的视角观察每种\n具体情况，我们可以看到具体情况与理论是否相符，即是否符合我们认\n为存在的法则。如果相符，我们的理解就是对的。\n自上而下地观察自然，我们会发现我们所说的人性其实很大一部分\n是动物性。这是因为人的大脑是数百万年的基因进化的结果，而其他物\n种的大脑也经历了类似的进化。因为人和其他动物有共同的祖先，并且\n\n===== ?127? =====\n受共同的规律支配，所以二者存在类似的特征和局限。例如，男人和女\n人的生殖过程、用两只眼睛进行深度感知，以及许多其他系统，是动物\n王国里的许多其他物种都具有的。类似地，人类大脑有一些\n“\n动物\n”\n部\n分，在进化意义上要比人类本身古老得多。这些共同规律是最高层次的\n规律。假如人类只是观察自身的话，是不会清楚地看到它们的。\n如果你只通过观察一个物种（如鸭子）尝试理解普适规律的话，你\n会失败。同样地，如果你只通过观察人类理解普适规律，你也会失败。\n人类只是约\n1 000\n万个物种里的\n1\n个。复杂的力量让原子不断组合、分\n离，形成无数的事物，人类只是沧海一粟。但大多数人就像蚂蚁一样，\n只专注于自身及其所在的蚁丘。他们以为宇宙围绕着人转，不关注对所\n有物种都适用的普适规律。\n为了弄清楚现实的普适规律和对待它们的原则，我发现有益的做法\n是，努力从自然的角度观察事物。尽管与其他物种相比人类非常聪明，\n但与整个自然相比，我们的智慧就像是生长在山岩上的苔藓。我们没有\n能力设计和制造一只蚊子，更不用说宇宙中所有的物种和大多数其他东\n西了。所以我的出发点是，自然比我更聪明，我努力让自然教我认识现\n实规律。\na.\n不要固守你对事物\n“\n应该\n”\n是什么样的看法，这将使你无法了解真\n实的情况。很重要的是，不要让偏见阻碍我们保持客观。想要取得好结\n果，我们需要冷静而不是情绪化。\n当我看到一些我（或人类）认为是错误的自然事物时，我会先假定\n我是错的，然后努力弄明白，为什么说自然如此运行是合理的。这让我\n认识了到很多东西，改变了我对以下问题的看法：（\n1\n）什么是好什么\n是坏；（\n2\n）我的人生目标是什么；（\n3\n）当面对最重要的抉择时我该怎\n么做。为了说明原因，我举一个简单的例子。\n多年前我去非洲时，看到一群鬣狗扑倒了一只幼小的角马。这让我\n觉得反胃。我对那只角马感到同情，并且认为我看到的景象很糟糕。但\n问题是，这件事是真的很糟糕，还是因为我有偏见所以认为它很糟糕，\n而事实上它好极了？这让我陷入思索。假如我看到的事情没有发生，世\n界会变好还是变差？这个视角促使我考虑这件事后续、再后续的影响，\n于是我发现那样的话世界将会变差。我现在认识到，自然会走向整体的\n\n===== ?128? =====\n最优化，而不是个体的最优化，但多数人只是根据事物对自身的影响判\n断好坏。我看到的情况是正在运行的自然进程，它能有效促进整个世界\n的改善，比人类发明的任何程序都有效得多。\n多数人把对自己或者自己关心的人不利的事情叫作坏事情，而忽视\n了更大的好。群体也有这种倾向：一种宗教的信仰者会认为自己的信仰\n好，其他人的信仰不好，导致两方信徒相互残杀，而且都坚信自己在做\n对的事情。通常，人们彼此冲突的信念或利益会妨碍他们从对方的视角\n看事情。这不好，也不理性。尽管我能理解，人们喜欢对自己有利的东\n西，不喜欢对自己有损的东西，但只根据事物对个人的影响就将其判定\n为绝对的好或绝对的坏，这是不合理的。这么做是在假定个人的愿望比\n整体的好更重要。在我看来，自然似乎把\n“\n好\n”\n定义为对整体好的东西，\n并通过最优化进程实现这种\n“\n好\n”\n，这是更好的做法。所以我开始相信一\n条普遍法则：\nb.\n一个东西要\n“\n好\n”\n，就必须符合现实的规律，并促进整体的进化，\n这能带来最大的回报。例如，如果你发明了某种世界觉得有价值的东\n西，你几乎肯定会获得回报。反之，状况不佳、偏离进化进程的人、物\n种和事物通常会遭到现实的惩罚。\n[4]\n在探寻所有事物的真相时，我开始相信：\nc.\n进化是宇宙中最强大的力量，是唯一永恒的东西，是一切的驱动\n力。\n[5]\n从最小的亚原子粒子到整个银河系，一切都在进化。尽管所有东\n西似乎都会死亡或消失，但真相是，它们只是以进化的形式重新组合\n了。还记得吗？能量是不能被摧毁的，只能改变其形态。所以，同样的\n东西一直在不断以不同形式分裂、重组。其背后的力量就是进化。\n例如，每个生物的首要目标是做基因的容器，基因不断进化出生\n命。每个个体体内的基因都来自远古时代，基因在承载它的个体死去之\n后还会长存，并进化出越来越复杂的形式。\n[6]\n在思考进化时，我意识到进化不仅仅以生命的形式存在，其传输机\n制也不仅仅是基因。科技、语言等，一切都在进化。例如，知识就像基\n因一样代代相传，不断进化。在很多代人的时间里，知识对人的总体影\n响和基因的影响一样大，甚至更大。\n\n===== ?129? =====\n进化是好的，因为它是一个适应的过程，通常会推动事物的改善。\n产品、组织、人类的能力，所有东西都在以类似的方式逐渐进化。这只\n不过是一个要么适应、改进，要么死亡的过程。在我看来，这个进化过\n程看起来就像右图：\n进化由各种适应和创造组成，它们能够提供即时的好处，但这些好\n处的价值会不断降低。这一痛苦的降低过程可能引发新的适应、创造，\n把新的产品、组织和人类能力带到新的、更高的进化水平上（参见\n143\n\n===== ?130? =====\n页图），也可能引发衰落和死亡，就像左侧的第二幅图所示。\n想想你知道的任何产品、组织或人，你就会知道这是真的。世界上\n到处都是曾经辉煌但逐渐衰落和毁灭的东西，只有极少数东西一直在重\n塑自身，不断达到伟大的新高度。所有机器最终都会崩坏、分解，机器\n的零件会被回收用来制造新的机器。我们人类也会经历这样的过程。有\n时这让我们悲伤，因为我们已经和我们的机器产生了感情，但如果从更\n高的层面来看的话，观察机器如何进化，其实是件很美妙的事。\n从这个角度，我们可以看到完美是不存在的，它是一个目标，激发\n永不停息的进化过程。假如自然或任何东西是完美的，它就不会进化。\n生物、组织和个人总是高度不完美的，但都拥有改善的能力。所以，与\n其顽固地隐藏我们的缺点，假装自己是完美的，还不如找出并应对我们\n的缺陷。你可以从自己犯的错误中获得教益，不断坚持，为成功做出更\n好的准备，否则就将失败。\n就像俗话说的：\nd.\n不进化就死亡。这个进化循环不仅适用于人，也适用于国家、企\n业、经济体，以及一切事物。整体会自动地自我修正，个体却不一定。\n例如，假如市场供给过多、浪费过多的话，价格就会下跌，企业就会破\n产，产能就会降低，直至供给下降到与需求相适应的水平，那时进化循\n环又会从相反的方向重新开始。与此类似，假如一个经济体的情况足够\n糟，经济管理者就会做出必需的政治改革和政策调整，否则他们将无法\n留任，只能把位子让出来，让继任者这样做。这些循环是连续的、以符\n合逻辑的方式推进的，而且有自我强化倾向。\n关键在于经历失败、学习和快速的改进。如果你不停地学习和改\n进，你的进化过程就会循环上升；如果做得不好，它就会如右图，甚至\n更糟。\n我相信：\n1.5\n\n进化是生命最大的成就和最大的回报\n进化是出于本能的，所以大多数人都会感觉到内心深处的这种动\n力，也就是说，我们本能地希望把事情做得更好，本能地创造和改进技\n\n===== ?131? =====\n术以帮助自己。历史表明所有物种都将或者灭绝或者进化成别的物种，\n只是我们寿命有限，不容易看到这一点。但我们确实知道，我们所说的\n人类，只不过是约\n20\n万年前基因进化成一种新形式带来的结果，而且人\n类肯定或者灭绝，或者进化到更高级的状态。我个人相信，在人造技术\n的帮助下，人类很可能将要开始加速进化，这些技术能够分析大量数\n据，以比人类更快更好的方式\n“\n思考\n”\n。我不知道要经历多少个世纪，人\n类才能进化成一种更高级的物种，比现在的人更接近于无所不知\n——\n如\n果人类没有自我毁灭的话。\n自然的一个奇妙之处是，自然中充满了个体生物，各自以符合自身\n利益的方式行动，不理解也不引导整体的变化，但它们构成了一个美妙\n运转且不断进化的整体系统。虽然我不是这方面的专家，但我觉得这是\n因为进化创造了：（\na\n）促使个体追求自身利益、最终使整体进步的激\n励和互动机制；（\nb\n）自然选择过程；（\nc\n）快速的试验和适应。\n\n===== ?132? =====\n\n===== ?133? =====\na.\n个体的激励机制必须符合群体的目标。自然创造了各种激励机\n制，促使追求自身利益的个体带来整体的进步。一个简单的例子是性与\n自然选择。自然给了人类极多的从事性行为的激励，主要表现为该行为\n会提供巨大的快乐，但它的目的是促进基因的进化。通过这一方式，每\n个个体的需求都得到了满足，也为整体的进化做了贡献。\nb.\n现实为了整体趋向最优化，而不是为了个体。为整体做贡献，你\n就可能收获回报。自然选择让更好的品种得以保留和传承（如更好的基\n因、更好的养育他人的能力、更好的产品等）。结果是整体的持续循环\n改进。\nc.\n通过快速试错以适应现实是无价的。不需要任何人的理解或引\n导，自然选择的试错过程就能实现改进。我们进行的学习也是这个道\n理。至少有三种学习能促进进化：以记忆为基础的学习（有意识地储存\n不断出现的信息，以便以后可以记起来）；潜意识的学习（从未进入意\n识的、我们从经验中习得的知识，但也会影响我们的决策）；与人类思\n考无关的\n“\n学习\n”\n，例如记录物种适应进程的基因的进化。我曾以为以记\n忆为基础的有意识的学习是最有力的，但我后来明白，试验和适应能带\n来更快的进步。想要明白自然是如何不依靠思考而改进的，只需看看\n（能思考的）人类与（连大脑都没有的）病毒斗智斗勇的过程。病毒就\n像是聪明的国际象棋对手。病毒飞快地进化（通过将不同种类病毒的遗\n传物质结合在一起），让全球卫生共同体里最聪明的人忙得不可开交，\n不断思索对付病毒的新办法。在当今这个时代，理解这一点尤为有用，\n因为今天的计算机可以运行大量展现进化过程的模拟程序，帮助我们看\n到哪些进化成功，哪些不成功。\n我将在下一条讲述一种一直在帮助我快速进化的流程，我相信也能\n帮到你们。但我想先强调，在确定什么对你重要、你要追求什么时，你\n的视角是多么重要。\nd.\n意识到你既是一切又什么都不是，并决定你想成为什么样子。\n个体的人既是一切又什么都不是，这是一个巨大的悖论。在我们自\n己看来，我们就是一切，例如，我们的生命终止了，对于我们而言，全\n世界也就消失了。因此对大多数人（以及其他物种）而言，失去生命是\n\n===== ?134? =====\n最糟糕不过的事情，因此尽量拥有最好的生活就是无比重要的。但是，\n如果从自然的视角俯视自身，我们显然又是毫无分量的。现实是，今天\n的每个人都只是约\n70\n亿人类中的一员，而人类又只是地球上约\n1 000\n万\n物种中的一个。地球只是银河系约\n1 000\n亿颗行星中的一个，而全宇宙\n有约\n2\n万亿个星系。人的寿命只是人类历史的约\n3 000\n分之一，而人类历\n史又只是地球历史的\n2\n万分之一。换言之，我们渺小、短命得不可思\n议，无论取得什么样的成就，其影响都是微不足道的。同时，我们又本\n能地希望有意义，希望进化，而我们只能产生一丁点儿意义。所有这些\n一点点的意义加起来，才是宇宙进化的推动力。\n问题是我们有多重要，以及如何进化。我们对其他人重要吗？（他\n们和我们一样，从宏大的视角来看也不重要。）我们是否在某种更大\n的、我们永远无法真正理解的意义上重要？还是说，我们重不重要这个\n问题根本不重要，所以我们应该忘掉它，及时行乐？\ne.\n你的未来取决于你的视角。你在一生中取得什么样的成就，将取\n决于你如何看待事物，以及你关心什么人、什么东西（你的家庭、社\n区、国家、人类、整个生态系统，等等）。你必须决定，你将在多大程\n度上把他人的利益置于自身利益之上，以及你将以这样的方式对待哪些\n人。这是因为你将不断遇到迫使你做出上述抉择的情况。\n也许这样的抉择不符合你的口味，似乎需要更加广博的知识储备，\n但无论是有意识地还是下意识地，你都将做出这样的抉择，而且这些抉\n择将是很重要的。\n就个人而言，我现在发现，拥抱现实、从自然的视角俯视自身、做\n宇宙整体微不足道的一小部分，是件很美妙的事。我本能的和有意识的\n目标都只是进化，利用自己的生命和特性，以某种微弱的方式为进化做\n贡献。同时，我最喜欢的东西（我的工作和人际关系）是我的驱动力。\n所以，我发现现实和自然的规律\n——\n包括我以及一切东西会如何分解、\n重组\n——\n都是美好的。尽管在情感上，对于将与我关心的东西最终分\n离，我很难接受。\n1.6\n\n理解自然提供的现实教训\n我发现，理解自然和进化的规律，在很多方面对我有好处。最重要\n\n===== ?135? =====\n的是，这会帮助我更有效地应对自己遇到的现实，做出艰难的抉择。当\n我开始从理解现实规律的视角看待现实，而不是认为现实不对时，我发\n现几乎所有起初看起来\n“\n不好\n”\n的东西，如雨天、缺点甚至死亡，都是由\n于我对于自己想要拥有的东西持有先入为主之见。我逐渐意识到，我产\n生这些最初的反应，是因为我没有把事物放到大背景下看待，即现实的\n构造是让整体实现最优，而不是尽力实现我的愿望。\na.\n把你的进化最大化。我在前文中提到，人独特的逻辑、抽象、从\n更高层次思考的能力，是在大脑皮层的构造中完成的。人类大脑的这些\n部分比动物更发达，让我们可以反思自身，引导自己的进化。因为我们\n能进行有意识的、以记忆为基础的学习，所以我们能比任何物种都更\n快、更深入地进化，不仅一代代地进化，而且在自己的一生中进化。\n这种持续地追求学习和改进的动力，让人类天生地对进步感到快\n乐，对快速进步感到兴奋。尽管大多数人觉得他们是在追求能让自己快\n乐的东西（玩具、大房子、金钱、地位等），但这些只能带来小的满\n足，远远无法与进步能给大多数人带去的长期的满足感相比。\n[7]\n一旦得\n到我们追求的东西，我们的满足感通常不会延续。这些东西只是诱饵。\n追逐诱饵要求我们必须进化，而且对所有人来说重要的是进化，而不是\n回报本身。这意味着对大多数人而言，成功就是以尽可能高效的方式拼\n搏和进化，即迅速认识自身和所处环境，然后通过改变实现进步。\n这是收益递减规律的自然结果。\n[8]\n想想赚钱这件事。一旦钱赚得太\n多，人从赚钱中得到的边际收益就会很小或者没有，这会对人产生负面\n影响，这和任何形式的过量是一个道理，如暴饮暴食。如果拥有健康的\n心智，人们就会开始探索新东西，或者更深入地探索旧东西，并在这个\n过程中变得更强大。如弗洛伊德所说，\n“\n爱与工作是人性的基石\n”\n。\n工作不一定是一份职业，不过我认为如果是职业的话，通常要好一\n些。工作可以是任何会使人进步的长期挑战。你也许已经猜到了，我相\n信，对于有意义的工作的需求，与人天生的进步渴望相关。而人际关系\n是人与他人的自然联系，它会使人对他人和整个社会有意义。\nb.\n记住\n“\n没有痛苦就没有收获\n”\n。我们天生想要进化，而我们追逐的\n其他东西尽管美好，却不能维持我们的快乐，这一认识帮助我聚焦于我\n的目标：不断进化，为整体进化贡献绵薄之力。虽然我们不喜欢痛苦，\n\n===== ?136? =====\n但自然的一切创造都有目的，所以自然让我们痛苦是有意图的。那么意\n图是什么？痛苦让我们清醒，帮助我们进步。\nc.\n自然的一项根本法则是，为了赢得力量，人必须努力突破极限，\n而这是痛苦的。正像卡尔\n·\n荣格所说，\n“\n人需要困难，这对健康来说是必\n需的\n”\n。但多数人本能地躲避痛苦。不论是锻炼身体还是历练头脑，人\n都会躲避痛苦，如举重的痛苦，如沮丧、思想挣扎、尴尬、耻辱的痛\n苦。当人面对自身存在缺陷这个严酷现实时，这一点就体现得更明显\n了。\n1.7\n\n痛苦\n+\n反思\n=\n进步\n人避免不了痛苦，尤其是在追求雄心勃勃的目标时。信不信由你，\n如果以正确的态度对待痛苦，感到痛苦就是你的幸运，因为这将提示你\n寻找解决方案以便继续前进。如果你能养成一种习惯，面对精神痛苦时\n能够自动地反思痛苦而不是躲避痛苦，你将能够快速地学习和进化。\n[9]\n直面你的问题、错误和弱点导致的痛苦现实，会大幅提高你的效率，我\n相信，只要你看到了这种做法的好处，你就不会再用别的做法了。你只\n需要把这种做法养成习惯。\n大多数人在痛苦时不愿反思，而一旦痛苦消失他们的注意力就会转\n移，所以他们难以通过反思得到教益。如果你在痛苦时就能好好反思\n（这个要求也许太高），这非常好。如果你能记得在痛苦消失后反思，\n这也很有价值。（我设计了一个\n“\n痛苦按钮\n”App\n帮助人们这么做，我将\n在附录中讲述它。）\n你面临的挑战将考验你，强化你。如果你没有经历过失败，就说明\n你没有努力突破极限，而如果你不努力突破极限，你就不能最大限度地\n挖掘自己的潜能。努力突破极限有时失败有时成功，但都能带来好处。\n虽然这种做法不一定适合所有人，但假如适合你的话，你会对此产生依\n赖，那将是一种美妙的体验。生活不可避免地会带给你这样的考验，而\n你愿不愿意以退为进、从失败中获益，取决于你自己。\n如果你选择在这条常常很痛苦的个人进化之路上拼搏，你将自然而\n然地不断\n“\n更上一层楼\n”\n。当你到达了更高一层的境界，你就会发现，你\n原来只是因为境界低才觉得之前包围着你的那些纷至沓来的东西令人头\n\n===== ?137? =====\n疼，但其实并没有那么糟。生活中的大多数东西都不过是\n“\n同类情况的\n重演\n”\n。你的层次越高，你就越能有效地应对现实，塑造符合你目标的\n结果。而曾经看起来复杂得不可思议的东西，也会变得简单。\na.\n迎接而非躲避痛苦。如果你不是放任自己，而是养成习惯，总是\n在一定程度的痛苦中工作，你将更快地进化。事情就是这样。\n每当你遇到痛苦的东西时，你就处在生活中一个潜在的重要节点：\n你可以选择健康并痛苦的事实，也可以选择不健康但舒适的幻觉。妙处\n在于，如果你选择了健康之路，痛苦将很快变成快乐。痛苦就是信号！\n就像不锻炼的人开始锻炼，养成享受痛苦的习惯，从痛苦中学习，将让\n人\n“\n步入新境界\n”\n。\n我所说的\n“\n步入新境界\n”\n是指，你将喜欢上以下三点：\n• \n找到、接受，并学会如何应对你的弱点；\n• \n更喜欢周围的人对你坦诚，而不是隐瞒对你的负面看法；\n• \n展现真实的自我，而不是强行把弱点伪装成优势。\nb.\n接受严厉的爱。在我的生活里，我想给他人尤其是我爱的人最好\n的东西是，应对现实以实现愿望的能力。为了实现增强他们能力的目\n标，我经常会否定他们的\n“\n愿望\n”\n，因为这样做将给予他们拼搏的机会，\n以便他们增强自己的力量，依靠自己实现愿望。这在情感上会让人难以\n接受，尽管他们在理智上明白，他们需要通过困难体验增强能力，如果\n我只是给他们想要的东西，就会削弱他们，最终导致他们需要更多的帮\n助。\n[10]\n当然，大多数人都希望自己没有缺点。我们接受的各种教育和现实\n经历让我们对自身的缺点感到难堪，并试图掩盖缺点。但能够真实展现\n自我的人是最快乐的。如果你能以开放的心态看待自身缺点，这将解放\n你，帮助你更好地应对缺点。我建议你不要为自己的缺点感到羞愧，要\n明白任何人都有缺点。把缺点摆上桌面将帮助你戒掉坏习惯，养成好习\n惯，获得真正的能力，拥有充足的理由保持乐观。\n\n===== ?138? =====\n这一创造性适应与提升的进化过程，即不断寻找、实现和追求更大\n胆的目标，不仅适用于个人与社会如何前进的问题。它同样适用于逆\n境，而逆境是不可避免的。你一生中必定会经历某个一败涂地的时刻。\n你可能工作失败、家庭失败、失去亲人、遭遇严重事故或疾病，或者发\n现你想象的生活永远遥不可及。总会有某些厄运找上你。那时，你将深\n陷痛苦，可能觉得失去了继续前行的力量。然而，你几乎总是有这样的\n力量\n——\n你最终能否成功，取决于你能否认识到这个事实，尽管可能当\n时看起来不是这样。\n正是由于这个原因，许多经历挫折的人，在成功适应挫折后变得和\n以前一样快乐，甚至更快乐，尽管当初的挫折似乎是毁灭性的。你的生\n活质量如何，将取决于你在这些痛苦时刻做出的抉择。一个人妥善适应\n的能力越强越好。\n[11]\n无论你想实现什么样的生活愿望，你的适应能\n力、在个人进化之路上快速有效前进的能力，将决定你能否成功和幸\n福。如果你做得好，你就能改变自己的心理反应模式，使痛苦成为某种\n你渴望的东西。\n1.8\n\n考虑后续与再后续的结果\n在认识到自然进化带来的更高层面的结果后，我开始发现，如果人\n们过度重视决策的直接结果而忽视后续和再后续的结果，他们就很难实\n现目标。这是因为直接结果和后续结果的值得追求性通常是相反的，这\n会造成决策的重大错误。例如，锻炼的直接结果是痛苦和花费时间，通\n常被视为不值得追求的，但后续结果是更健康和更具吸引力的形象，这\n是值得追求的。类似地，好吃的食物往往对你身体不好，反之亦然。\n直接结果经常是诱惑，导致我们失去真正想要的东西，直接结果有\n时也是障碍。这就好像自然正在对我们进行分类：自然扔给我们各种暗\n藏玄机、结果有好有坏的选择，而那些决策时只考虑直接结果的人会受\n到惩罚。\n而有的人选择自己真正想要的东西，","link":"https://book.douban.com/subject/27608239/"}]},{"id":"chain","name":"产业链·机器人","emoji":"🔧","tasks":[{"id":"chain-20260816-1","text":"机器人第1课：机器人是什么、三大分类、产业链全景，写3行笔记"}],"materials":[{"id":"chain-20260816-m1","title":"机器人第1课：机器人是什么、三大分类、产业链全景","body":"大白话：机器人=能感知+能决策+能行动的机器。按用途分三类：工业机器人（工厂里干活）、服务机器人（给个人/家庭/商用服务）、特种机器人（救灾/水下/军工）。一条产业链长这样：上游核心零部件（减速器、伺服电机、控制器、传感器）→ 中游本体制造（把零部件组装成机器人）→ 下游应用（汽车、3C、物流、医疗等行业用它）。今天先把这张图刻在脑子里。\n\n（学完把笔记/问题发我，我帮你加深并调整明天内容）","link":"https://zh.wikipedia.org/wiki/机器人"}]}]}]};
var DATA=DEFAULT;
var CK='wang_checks',MT='wang_mats';
var checks={};try{checks=JSON.parse(localStorage.getItem(CK)||'{}');}catch(e){}
var mats={};try{mats=JSON.parse(localStorage.getItem(MT)||'{}');}catch(e){}
var curMat=null;
var tab='home',q='',fBlock='全部',fStatus='全部';
function saveChecks(){localStorage.setItem(CK,JSON.stringify(checks));}
function saveMats(){localStorage.setItem(MT,JSON.stringify(mats));}
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cleanTitle(s){return String(s).replace(/（占位）|\(占位\)/g,'').trim();}
function planOf(ds){var p=null;(DATA.plans||[]).forEach(function(x){if(x.date===ds)p=x;});return p;}
function allPlans(){return (DATA.plans||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});}
function todayPlan(){return planOf(todayStr());}
function tomorrowPlan(){var d=new Date();d.setDate(d.getDate()+1);return planOf(ymd(d));}
function blocksOf(p){return (p&&p.blocks)||[];}
function tasksOf(p){var a=[];blocksOf(p).forEach(function(b){(b.tasks||[]).forEach(function(t){a.push({b:b,t:t});});});return a;}
function matsOf(p){var a=[];blocksOf(p).forEach(function(b){(b.materials||[]).forEach(function(m){a.push({b:b,m:m});});});return a;}
function dayStats(ds){var tt=tasksOf(planOf(ds)),total=tt.length,done=0;tt.forEach(function(x){if(checks[x.t.id])done++;});return {total:total,done:done,pct:total?Math.round(done/total*100):0};}
function dayFull(ds){var p=planOf(ds),tt=tasksOf(p);if(!tt.length)return null;var all=true;tt.forEach(function(x){if(!checks[x.t.id])all=false;});return all;}
function streak(){var n=0,d=new Date(),g=0;if(!dayFull(ymd(d)))d.setDate(d.getDate()-1);for(;;){if(++g>400)break;var ds=ymd(d),r=dayFull(ds);if(r===null){d.setDate(d.getDate()-1);continue;}if(r){n++;d.setDate(d.getDate()-1);}else break;}return n;}
function cumStats(){var days=0,tasks=0,matsN=0,matsRead=0,fbN=0;allPlans().forEach(function(p){if(p.date>todayStr())return;var tt=tasksOf(p),all=true;tt.forEach(function(x){if(checks[x.t.id])tasks++;else all=false;});if(tt.length&&all)days++;matsOf(p).forEach(function(x){matsN++;var s=mats[x.m.id];if(s&&s.read)matsRead++;if(s&&s.feedback)fbN++;});});return {days:days,tasks:tasks,matsN:matsN,matsRead:matsRead,fbN:fbN};}
function firstDay(){var m=null;allPlans().forEach(function(p){if(!m||p.date<m)m=p.date;});return m;}
function dayNo(){var f=firstDay();if(!f)return 1;var a=f.split('-'),b=todayStr().split('-');var d1=new Date(+a[0],+a[1]-1,+a[2]),d2=new Date(+b[0],+b[1]-1,+b[2]);return Math.round((d2-d1)/86400000)+1;}
function fmtCN(ds){var p=ds.split('-'),s=parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日';var t=new Date(),y=new Date(),tm=new Date();y.setDate(y.getDate()-1);tm.setDate(tm.getDate()+1);if(ds===ymd(t))s+=' · 今天';else if(ds===ymd(y))s+=' · 昨天';else if(ds===ymd(tm))s+=' · 明天';return s;}
function matSt(id){var s=mats[id];return s&&s.read?(s&&s.feedback?'已读·有反馈':'已读'):'未读';}
function matChip(id){var s=mats[id];var c=s&&s.read?(s&&s.feedback?'fb':'read'):'unread';var t=s&&s.read?(s&&s.feedback?'已读·有反馈':'已读'):'未读';return '<span class="lr-s st-'+c+'">'+t+'</span>';}
function blockEn(id){var m={'read':'READ','chain':'CHAIN','news':'NEWS','ind':'DAILY','ai':'AI DAILY'};return m[id]||'BLOCK';}

function render(){
  document.getElementById('tbHome').className=tab==='home'?'on':'';
  document.getElementById('tbCheck').className=tab==='check'?'on':'';
  document.getElementById('tbTalk').className=tab==='talk'?'on':'';
  document.getElementById('tbMine').className=tab==='mine'?'on':'';
  var tb=document.getElementById('tbTitle'),btn=document.getElementById('tbBtn');
  if(tab==='talk'){tb.textContent='AI管家';btn.textContent='写需求';btn.onclick=focusMsg;}
  else if(tab==='mine'){tb.textContent='我的';btn.textContent='⚙ 设置';btn.onclick=openSettings;}
  else if(tab==='check'){tb.textContent='打卡记录';btn.textContent='今日小结';btn.onclick=openReview;}

function renderHome(){

    var back={};
    allPlans().forEach(function(p){if(p.date>=today)return;tasksOf(p).forEach(function(x){if(!checks[x.t.id])(back[x.b.id]=back[x.b.id]||[]).push({t:x.t,date:p.date});});});
    blocksOf(tp).forEach(function(b){
      var tt=(b.tasks||[]).slice(),bf=back[b.id]||[];

    html='<div class="card"><div class="empty">今天还没有计划，管家今晚会生成明天的。</div></div>';

  }

  document.getElementById('main').innerHTML=h;

var MS='wang_msgs';
var msgs=[];try{var _m=JSON.parse(localStorage.getItem(MS)||'[]');if(Object.prototype.toString.call(_m)==='[object Array]')msgs=_m;}catch(e){}
function saveMsgs(){localStorage.setItem(MS,JSON.stringify(msgs));}
function addMsg(){
  var t=document.getElementById('msgTxt').value.trim();
  if(!t){alert('先写点什么再存');return;}
  msgs.push({id:String(Date.now()),date:todayStr(),text:t});
  saveMsgs();render();
}
function delMsg(id){msgs=msgs.filter(function(x){return x.id!==id;});saveMsgs();render();}
function clearMsgs(){if(!msgs.length){alert('还没有留言');return;}if(confirm('清空全部留言？')){msgs=[];saveMsgs();render();}}
function copyOne(id){var m=null;msgs.forEach(function(x){if(x.id===id)m=x;});if(!m)return;copyText('【织网·需求】'+fmtCN(m.date)+'\n'+m.text);}
function copyMsgs(){
  if(!msgs.length){alert('还没有留言，先写一条');return;}
  var txt='【织网·需求】'+fmtCN(todayStr())+'\n';
  msgs.forEach(function(x,i){txt+=(i+1)+'. '+x.text+'\n';});
  var st=dayStats(todayStr());
  txt+='\n今日完成 '+st.done+'/'+st.total+'（'+st.pct+'%）';
  copyText(txt);
}
function focusMsg(){var t=document.getElementById('msgTxt');if(t){try{t.focus();}catch(e){}}}
function copyText(txt){
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('已复制，粘贴到AI管家对话框发给我即可');}catch(e){alert('复制失败，请长按下面文字复制：\n\n'+txt);}
  document.body.removeChild(ta);
}

function switchTab(t){tab=t;render();}
function onSearch(v){q=v.trim();render();}
function resetF(){q='';fBlock='全部';fStatus='全部';render();}
function setF(k,v){if(k==='block')fBlock=v;else fStatus=v;render();}
function toggle(id){
  if(checks[id]){delete checks[id];}else{checks[id]=todayStr();}
  saveChecks();render();
}
function openMat(bid,mid){
  var m=null;
  allPlans().forEach(function(x){matsOf(x).forEach(function(y){if(y.m.id===mid)m=y.m;});});
  if(!m)return;
  curMat=mid;
  document.getElementById('mTitle').textContent=cleanTitle(m.title);
  document.getElementById('mBody').textContent=m.body;
  var ml=document.getElementById('mLink');
  if(m.link){ml.href=m.link;ml.style.display='inline-block';}else{ml.style.display='none';}
  document.getElementById('mFb').value=(mats[mid]&&mats[mid].feedback)||'';
  showModal('modal');
  if(!mats[mid]||!mats[mid].read){mats[mid]=mats[mid]||{};mats[mid].read=true;saveMats();render();}
}
function saveFb(){
  if(!curMat)return;
  var fb=document.getElementById('mFb').value.trim();
  mats[curMat]=mats[curMat]||{};mats[curMat].feedback=fb;saveMats();
  closeModal();render();
  alert(fb?'反馈已保存，管家更新明天计划时会参考':'反馈已清空');
}

  html+='<div style="font-size:14px;font-weight:600;margin-bottom:4px">还没做的</div>';
  html+='<div style="font-size:13px;color:var(--muted);margin-bottom:10px">'+(undone.length?undone.map(function(x){return esc(x.b.name+' '+x.t.text);}).join('<br>'):'全做完了，真棒！')+'</div>';
  html+='<div style="font-size:14px;font-weight:600;margin-bottom:4px">你的反馈</div>';
  html+='<div style="font-size:13px;color:var(--muted)">'+(fb.length?fb.join('<br><br>'):'还没有反馈')+'</div>';
  document.getElementById('revBody').innerHTML=html;
  showModal('revModal');
}
function openSettings(){showModal('setModal');}
function copyFeedback(){
  var ds=todayStr(),st=dayStats(ds),undone=tasksOf(todayPlan()).filter(function(x){return !checks[x.t.id];});
  var fb=[];
  allPlans().forEach(function(p){matsOf(p).forEach(function(x){var s=mats[x.m.id];if(s&&s.feedback)fb.push('【'+cleanTitle(x.m.title)+'】'+s.feedback);});});
  var txt='织网 反馈 · '+fmtCN(ds)+'\n';
  txt+='今日完成 '+st.done+'/'+st.total+'（'+st.pct+'%）\n';
  txt+='未完成：'+(undone.length?undone.map(function(x){return x.b.name+' '+x.t.text;}).join('、'):'无')+'\n';
  txt+='资料反馈：\n'+(fb.length?fb.join('\n'):'（无）');
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('已复制，粘贴发给AI管家即可');}catch(e){alert('复制失败，请长按下面文字复制：\n\n'+txt);}
  document.body.removeChild(ta);
}
function showModal(id){document.getElementById(id).style.display='block';document.getElementById('mask').style.display='block';}
function closeModal(){document.querySelectorAll('.modal').forEach(function(m){m.style.display='none';});document.getElementById('mask').style.display='none';}
render();
fetch('materials.json').then(function(r){return r.json();}).then(function(d){if(!d||!d.plans)return;DATA=d;render();}).catch(function(){});
</script>
