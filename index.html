function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function planOf(ds){var p=null;(DATA.plans||[]).forEach(function(x){if(x.date===ds)p=x;});return p;}

function matsOf(p){var a=[];blocksOf(p).forEach(function(b){(b.materials||[]).forEach(function(m){a.push({b:b,m:m});});});return a;}
function dayStats(ds){var tt=tasksOf(planOf(ds)),total=tt.length,done=0;tt.forEach(function(x){if(checks[x.t.id])done++;});return {total:total,done:done,pct:total?Math.round(done/total*100):0};}

function streak(){var n=0,d=new Date();if(!dayFull(ymd(d)))d.setDate(d.getDate()-1);for(;;){var ds=ymd(d),r=dayFull(ds);if(r===null){d.setDate(d.getDate()-1);continue;}if(r){n++;d.setDate(d.getDate()-1);}else break;}return n;}
function cumStats(){var days=0,tasks=0,matsN=0,matsRead=0,fbN=0;allPlans().forEach(function(p){if(p.date>todayStr())return;var tt=tasksOf(p),all=true;tt.forEach(function(x){if(checks[x.t.id])tasks++;else all=false;});if(tt.length&&all)days++;matsOf(p).forEach(function(x){matsN++;var s=mats[x.m.id];if(s&&s.read)matsRead++;if(s&&s.feedback)fbN++;});});return {days:days,tasks:tasks,matsN:matsN,matsRead:matsRead,fbN:fbN};}

  var ml=[],seen={};
  allPlans().forEach(function(p){matsOf(p).forEach(function(x){if(seen[x.m.id])return;seen[x.m.id]=1;ml.push('<div class="listrow" onclick="openMat(\''+x.b.id+'\',\''+x.m.id+'\')"><span class="lr-t">'+esc(cleanTitle(x.m.title))+'</span>'+matChip(x.m.id)+'</div>');});});
  h+='<div class="card"><div class="chh"><span class="dot"></span><span class="tt">资料库</span><span class="en">ARCHIVE</span></div><div class="btag" style="padding-left:16px;margin-bottom:4px">已读 '+cs.matsRead+'/'+cs.matsN+' 篇</div>';
  h+=(ml.length?ml.join(''):'<div class="empty2"><div class="eico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8a6d22" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5z"/><path d="M19 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg></div><div>管家会每天往这里放新资料。</div></div>')+'</div>';
  h+='<div class="card"><div class="chh"><span class="dot"></span><span class="tt">关于织网</span><span class="en">ABOUT</span></div><div style="font-size:12px;color:var(--muted);line-height:2">数据存本机 · 不上传不联网<br>无登录 · 无广告 · 无收费<br>每日计划由管家更新，每晚生成第二天<br><b style="color:var(--green)">织网 v8 · 每日计划版</b></div></div>';
  document.getElementById('main').innerHTML=h;
}

var MS='wang_msgs';
var msgs=[];try{var _m=JSON.parse(localStorage.getItem(MS)||'[]');if(Object.prototype.toString.call(_m)==='[object Array]')msgs=_m;}catch(e){}
function saveMsgs(){localStorage.setItem(MS,JSON.stringify(msgs));}
function addMsg(){
  var t=document.getElementById('msgTxt').value.trim();
  if(!t){alert('先写点什么再存');return;}
  msgs.push({id:String(Date.now()),date:todayStr(),text:t});
  saveMsgs();render();
}
function delMsg(id){msgs=msgs.filter(function(x){return x.id!==id;});saveMsgs();render();}
function clearMsgs(){if(!msgs.length){alert('还没有留言');return;}if(confirm('清空全部留言？')){msgs=[];saveMsgs();render();}}
function copyOne(id){var m=null;msgs.forEach(function(x){if(x.id===id)m=x;});if(!m)return;copyText('【织网·需求】'+fmtCN(m.date)+'\n'+m.text);}
function copyMsgs(){
  if(!msgs.length){alert('还没有留言，先写一条');return;}
  var txt='【织网·需求】'+fmtCN(todayStr())+'\n';
  msgs.forEach(function(x,i){txt+=(i+1)+'. '+x.text+'\n';});
  var st=dayStats(todayStr());
  txt+='\n今日完成 '+st.done+'/'+st.total+'（'+st.pct+'%）';
  copyText(txt);
}
function focusMsg(){var t=document.getElementById('msgTxt');if(t){try{t.focus();}catch(e){}}}
function copyText(txt){
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('已复制，粘贴到AI管家对话框发给我即可');}catch(e){alert('复制失败，请长按下面文字复制：\n\n'+txt);}
  document.body.removeChild(ta);
}
function renderTalk(){
  var h='<div class="hero">';
  h+='<div class="hrow"><div class="hbrand"><div class="avatar" style="width:38px;height:38px;font-size:18px">聊</div><div><div class="bname">和AI管家对话</div><div class="ben">TALK TO YOUR AI STEWARD</div></div></div><div class="hbadge">'+(msgs.length?msgs.length+' 条留言':'给AI管家留言')+'</div></div>';
  h+='<div class="gsen">DAILY FEEDBACK LOOP</div>';
  h+='<h2 class="serif">说说你的需求</h2>';
  h+='<div class="sub">把需求、变更直接写下来发给AI管家，我更新你的每日计划。</div>';
  h+='</div>';
  var rp=DATA.reply;
  h+='<div class="card"><div class="chh"><span class="dot"></span><span class="tt">AI管家回复</span><span class="en">REPLY</span></div>';
  h+=(rp&&rp.text?'<div class="fb"><div class="fbq">'+esc(rp.text)+'</div><div class="fbt">'+(rp.date?fmtCN(rp.date):'')+'</div></div>':'<div class="empty2"><div class="eico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8a6d22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></div><div>还没有回复。发一条留言给AI管家，我更新后会回在这里。</div></div>')+'</div>';
  h+='<div class="card focus"><div class="chh"><span class="dot"></span><span class="tt">写需求</span><span class="en">NEW NOTE</span></div>';
  h+='<textarea id="msgTxt" class="msgbox" placeholder="例：加一项健身，周二/周六/周日练胸肩背"></textarea>';
  h+='<button class="btn" onclick="addMsg()">存进留言</button>';
  h+='<div class="hint">存好后点下方「复制发给AI管家」，粘贴到AI管家对话框发给我；我更新计划后把回复贴回上面。</div>';
  h+='</div>';
  h+='<div class="card"><div class="chh"><span class="dot"></span><span class="tt">我的留言</span><span class="en">MY NOTES</span></div>';
  if(msgs.length){
    var ml=msgs.slice().reverse().map(function(x){return '<div class="msg"><div class="mt">'+fmtCN(x.date)+'</div><div class="mx">'+esc(x.text)+'</div><div class="mb"><button onclick="copyOne(\''+x.id+'\')">复制</button><button class="del" onclick="delMsg(\''+x.id+'\')">删除</button></div></div>';}).join('');
    h+=ml;
    h+='<div class="resbtns"><button class="g" onclick="copyMsgs()">复制发给AI管家</button></div>';
    h+='<div style="text-align:right;padding:0 4px 2px"><button class="ghost" onclick="clearMsgs()">清空留言</button></div>';
  }else{
    h+='<div class="empty2"><div class="eico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#8a6d22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9h8M8 12h5"/></svg></div><div>还没有留言。想加需求、改计划，写一条吧。</div></div>';
    h+='<div class="hint" style="text-align:center">写一条需求存好，它会出现在这里，再一键复制发给AI管家。</div>';
  }
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}
function switchTab(t){tab=t;render();}
function onSearch(v){q=v.trim();render();}
function resetF(){q='';fBlock='全部';fStatus='全部';render();}
function setF(k,v){if(k==='block')fBlock=v;else fStatus=v;render();}
function toggle(id){
  if(checks[id]){delete checks[id];}else{checks[id]=todayStr();}
  saveChecks();render();
}
function openMat(bid,mid){
  var m=null;
  allPlans().forEach(function(x){matsOf(x).forEach(function(y){if(y.m.id===mid)m=y.m;});});
  if(!m)return;
  curMat=mid;
  document.getElementById('mTitle').textContent=cleanTitle(m.title);
  document.getElementById('mBody').textContent=m.body;
  document.getElementById('mLink').href=m.link||'#';
  document.getElementById('mFb').value=(mats[mid]&&mats[mid].feedback)||'';
  showModal('modal');
  if(!mats[mid]||!mats[mid].read){mats[mid]=mats[mid]||{};mats[mid].read=true;saveMats();render();}
}
function saveFb(){
  if(!curMat)return;
  var fb=document.getElementById('mFb').value.trim();
  mats[curMat]=mats[curMat]||{};mats[curMat].feedback=fb;saveMats();
  closeModal();render();
  alert(fb?'反馈已保存，管家更新明天计划时会参考':'反馈已清空');
}
function openReview(){
  var ds=todayStr(),st=dayStats(ds),undone=tasksOf(todayPlan()).filter(function(x){return !checks[x.t.id];});
  var fb=[];
  allPlans().forEach(function(p){matsOf(p).forEach(function(x){var s=mats[x.m.id];if(s&&s.feedback)fb.push('【'+cleanTitle(x.m.title)+'】'+s.feedback);});});
  var html='<div style="font-size:18px;font-weight:600;color:var(--green);margin-bottom:4px" class="serif">今日完成 '+st.done+'/'+st.total+'</div>';
  html+='<div style="font-size:13px;color:var(--muted);margin-bottom:10px">完成度 '+st.pct+'% · 连续打卡 '+streak()+' 天</div>';
  html+='<div style="font-size:14px;font-weight:600;margin-bottom:4px">还没做的</div>';
  html+='<div style="font-size:13px;color:var(--muted);margin-bottom:10px">'+(undone.length?undone.map(function(x){return esc(x.b.name+' '+x.t.text);}).join('<br>'):'全做完了，真棒！')+'</div>';
  html+='<div style="font-size:14px;font-weight:600;margin-bottom:4px">你的反馈</div>';
  html+='<div style="font-size:13px;color:var(--muted)">'+(fb.length?fb.join('<br><br>'):'还没有反馈')+'</div>';
  document.getElementById('revBody').innerHTML=html;
  showModal('revModal');
}
function openSettings(){showModal('setModal');}
function copyFeedback(){
  var ds=todayStr(),st=dayStats(ds),undone=tasksOf(todayPlan()).filter(function(x){return !checks[x.t.id];});
  var fb=[];
  allPlans().forEach(function(p){matsOf(p).forEach(function(x){var s=mats[x.m.id];if(s&&s.feedback)fb.push('【'+cleanTitle(x.m.title)+'】'+s.feedback);});});
  var txt='织网 反馈 · '+fmtCN(ds)+'\n';
  txt+='今日完成 '+st.done+'/'+st.total+'（'+st.pct+'%）\n';
  txt+='未完成：'+(undone.length?undone.map(function(x){return x.b.name+' '+x.t.text;}).join('、'):'无')+'\n';
  txt+='资料反馈：\n'+(fb.length?fb.join('\n'):'（无）');
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('已复制，粘贴发给AI管家即可');}catch(e){alert('复制失败，请长按下面文字复制：\n\n'+txt);}
  document.body.removeChild(ta);
}
function showModal(id){document.getElementById(id).style.display='block';document.getElementById('mask').style.display='block';}
function closeModal(){document.querySelectorAll('.modal').forEach(function(m){m.style.display='none';});document.getElementById('mask').style.display='none';}
render();
fetch('materials.json').then(function(r){return r.json();}).then(function(d){if(!d||!d.plans)return;DATA=d;render();}).catch(function(){});
</script>
</body>
</html>
